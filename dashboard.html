<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0a1a2f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #112b4a;
      position: relative;
    }

    .logout-btn {
      position: absolute;
      right: 20px;
      top: 20px;
      background: #d4a64a;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .tabs button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #d4a64a;
      font-weight: bold;
    }

    .content {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .video-card {
      background: #112b4a;
      margin: 15px 0;
      padding: 15px;
      border-radius: 10px;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    a {
      color: #d4a64a;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h2>Young Einsteins Academy - Student Portal</h2>
  <p id="studentInfo">Loading...</p>

  <!-- 🔥 LOGOUT BUTTON -->
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="tabs">
  <button onclick="show('math')">Mathematics</button>
  <button onclick="show('physics')">Physical Sciences</button>
</div>

<div class="content">

  <div id="math">
    <h3>📘 Mathematics Videos</h3>
  </div>

  <div id="physics" class="hidden">
    <h3>🔬 Physical Sciences Videos</h3>
  </div>

</div>

<script src="dashboard.js"></script>

<script>
  // 🔴 LOGOUT FUNCTION
  async function logout() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert("Logout failed");
      return;
    }

    window.location.href = "login.html";
  }
</script>

</body>
</html>
