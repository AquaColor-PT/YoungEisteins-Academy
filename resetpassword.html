<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0a1a2f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #112b4a;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #d4a64a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🔐 Reset Password</h2>

  <input type="password" id="newPassword" placeholder="New password">

  <button onclick="resetPassword()">Update Password</button>

  <div class="msg" id="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://sjhnspvibjmckepnrefu.supabase.co";
const SUPABASE_KEY = "sb_publishable_z8UxqPtegbbPujwBVAgSow_Js-Z2Wye";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔥 VERY IMPORTANT: restore session from email link
async function restoreSession() {
  const hash = window.location.hash;

  if (hash) {
    const params = new URLSearchParams(hash.substring(1));

    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");

    if (access_token && refresh_token) {
      const { error } = await supabaseClient.auth.setSession({
        access_token,
        refresh_token
      });

      if (error) {
        console.log("Session restore error:", error);
      } else {
        console.log("✅ Session restored");
      }
    }
  }
}

// 🔐 handle password update
async function resetPassword() {
  const newPassword = document.getElementById("newPassword").value;
  const msg = document.getElementById("msg");

  if (!newPassword) {
    msg.textContent = "❌ Enter a new password";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({
    password: newPassword
  });

  if (error) {
    msg.textContent = "❌ " + error.message;
    return;
  }

  msg.textContent = "✅ Password updated successfully! Redirecting...";

  setTimeout(() => {
    window.location.href =
      "https://aquacolor-pt.github.io/YoungEisteins-Academy/login.html";
  }, 1500);
}

// 🚀 RUN ON LOAD
restoreSession();
</script>

</body>
</html>
